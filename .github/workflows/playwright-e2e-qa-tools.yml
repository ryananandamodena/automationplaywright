name: 🎭 Playwright E2E - AI QA Platform

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'qa_tools/**'
      - '.github/workflows/playwright-e2e.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'qa_tools/**'
  workflow_dispatch: {}
  schedule:
    - cron: '0 19 * * *'   # setiap hari jam 2 pagi WIB

env:
  NODE_VERSION: '20'

jobs:
  e2e:
    name: 🧪 Run Playwright E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📝 Create .env for docker-compose stack
        working-directory: qa_tools
        run: |
          cat > .env << EOF
          APP_ENV=test
          LOG_LEVEL=INFO
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=ai_qa_db
          DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ai_qa_db
          REDIS_URL=redis://redis:6379/0
          JWT_SECRET=${{ secrets.JWT_SECRET || 'ci_test_jwt_secret_do_not_use_in_prod' }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY || 'ci_test_encryption_key_32_chars!!' }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          API_V1_STR=/api/v1
          BACKEND_CORS_ORIGINS=["http://localhost:3000"]
          NEXT_PUBLIC_API_URL=http://localhost:8000
          EOF

      - name: 🐳 Build & start stack (postgres, redis, backend, worker, frontend)
        working-directory: qa_tools
        run: docker compose up -d --build

      - name: ⏳ Wait for frontend & backend to be ready
        run: |
          echo "Waiting for backend..."
          npx wait-on -t 120000 http://localhost:8000/docs || (docker compose -f qa_tools/docker-compose.yml logs backend && exit 1)
          echo "Waiting for frontend..."
          npx wait-on -t 120000 http://localhost:3000 || (docker compose -f qa_tools/docker-compose.yml logs frontend && exit 1)

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: qa_tools/playwright/package-lock.json

      - name: 📦 Install Playwright test dependencies
        working-directory: qa_tools/playwright
        run: npm ci

      - name: 🎭 Install Playwright browsers
        working-directory: qa_tools/playwright
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run Playwright tests
        working-directory: qa_tools/playwright
        run: npx playwright test --project=chromium
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: 🐳 Dump docker logs on failure
        if: failure()
        working-directory: qa_tools
        run: docker compose logs --no-color > docker-compose-logs.txt

      - name: 📤 Upload docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: qa_tools/docker-compose-logs.txt
          retention-days: 7

      - name: 📤 Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa_tools/playwright/playwright-report/
          retention-days: 30

      - name: 📤 Upload test results (screenshots/videos/traces on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: qa_tools/playwright/test-results/
          retention-days: 7

      - name: 🛑 Stop stack
        if: always()
        working-directory: qa_tools
        run: docker compose down -v
