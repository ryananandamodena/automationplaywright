name: E2E Tests - FMS Contract & Service

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'test-playwright/**'
      - '.github/workflows/e2e-tests.yml'

  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'test-playwright/**'
  
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - contract
          - e2e
          - approval
          - vehicle
          - prive
      browser:
        description: 'Browser to use'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
  
  schedule:
    - cron: '0 2 * * *'

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        test: [contract, e2e, approval]
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Contract Creation Test
        if: matrix.test == 'contract' || github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'contract'
        working-directory: test-playwright
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL }}
          HEADLESS: true
        run: node create-contract-simple.mjs
        continue-on-error: true
      
      - name: Run Full E2E Test
        if: matrix.test == 'e2e' || github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'e2e'
        working-directory: test-playwright
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL }}
          HEADLESS: true
        run: node contract-service-e2e-flexible.mjs
        continue-on-error: true
      
      - name: Run Approval Flow Test
        if: matrix.test == 'approval' || github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'approval'
        working-directory: test-playwright
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          APPROVER1_EMAIL: ${{ secrets.APPROVER1_EMAIL }}
          APPROVER1_PASSWORD: ${{ secrets.APPROVER1_PASSWORD }}
          APPROVER2_EMAIL: ${{ secrets.APPROVER2_EMAIL }}
          APPROVER2_PASSWORD: ${{ secrets.APPROVER2_PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL }}
          HEADLESS: true
        run: node contract-approval-e2e.mjs
        continue-on-error: true
      
      - name: Upload screenshots on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.test }}
          path: test-playwright/*.png
          retention-days: 7
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test }}
          path: test-playwright/test-results/
          retention-days: 7
      
      - name: Send Slack notification on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "E2E Tests Failed on ${{ matrix.test }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*E2E Tests Failed* :x:\n*Test:* ${{ matrix.test }}\n*Branch:* ${{ github.ref }}\n*Commit:* ${{ github.sha }}"
                  }
                }
              ]
            }